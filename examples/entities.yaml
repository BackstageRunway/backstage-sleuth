---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-with-code-deployment-slug
  annotations:
    sleuth.io/project-slug: backstagerunway-app
    sleuth.io/code-deployment-slug: backstage
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-heart
  annotations:
    sleuth.io/project-slug: backstagerunway-app
    # sleuth.io/code-deployment-slug: sleuth-clients  # Optional - defaults to entity name
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: community-plugins
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: prd
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dora-with-code-deployment-slug-mk
  annotations:
    sleuth.io/code-deployment-slug: mkdocs-techdocs-core
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: aws
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dora
  annotations: 
    sleuth.io/code-deployment-slug: dora
    # sleuth.io/code-deployment-slug: backstagerunway-app  # Optional - defaults to entity name
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: prd
  providesApis: [example-grpc-api]
---
# Example showing minimal configuration - uses defaults from app-config.yaml
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sleuth
  # No sleuth.io annotations - will use defaults from app-config.yaml
  # project-slug: defaults to 'backstagerunway-app' from config
  # code-deployment-slug: defaults to entity name 'simple-service'
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: prd
